name: Release AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04 
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config nasm file \
            libglvnd-dev libwayland-egl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            libasound2-dev libpulse-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-install
          key: ffmpeg-7.1-dav1d-1.4.3-ubuntu2204-v1

      - name: Build dav1d
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y meson
          git clone --depth 1 --branch 1.4.3 https://code.videolan.org/videolan/dav1d.git
          cd dav1d
          meson setup build --prefix=$GITHUB_WORKSPACE/ffmpeg-install \
            --libdir=lib --default-library=shared \
            -Denable_tools=false -Denable_tests=false
          ninja -C build install

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/ffmpeg-install/lib/pkgconfig
          wget -q https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          tar xf ffmpeg-7.1.tar.xz
          cd ffmpeg-7.1
          ./configure \
            --prefix=$GITHUB_WORKSPACE/ffmpeg-install \
            --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-debug \
            --disable-autodetect --enable-zlib \
            --enable-libdav1d
          make -j$(nproc)
          make install

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffmpeg-install/lib/pkgconfig:$PKG_CONFIG_PATH"
          ls $GITHUB_WORKSPACE/ffmpeg-install/lib/pkgconfig
          pkg-config --modversion libavcodec
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=$PWD/AppDir cmake --install build

      - name: Tools linuxdeploy
        run: |
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Packaging in AppImage
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$GITHUB_WORKSPACE/ffmpeg-install/lib:$LD_LIBRARY_PATH"
          export LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_REF_NAME#v}"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so;libqwayland-egl.so"
          export EXTRA_QT_PLUGINS="wayland-shell-integration;wayland-graphics-integration-client;xcbglintegrations"

          mkdir -p AppDir/usr/plugins
          cp -r "$QT_ROOT_DIR/plugins/wayland-graphics-integration-client" AppDir/usr/plugins/

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/FFEditor.desktop \
            --icon-file assets/images/FFEditor.png \
            --deploy-deps-only AppDir/usr/plugins/wayland-graphics-integration-client \
            --plugin qt \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "*.AppImage"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.AppImage"